<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LORO — სილამაზის სალონი (დემო)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Noto+Serif+Georgian:wght@300;500&family=Noto+Sans+Georgian:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Scroll dyes the page: --bg and --fg are driven by JS through eight hair tones. */
  :root {
    --bg: #1c1210;
    --fg: #f4e6cf;
    --muted: rgba(244, 230, 207, .66);
    --line: rgba(244, 230, 207, .22);
    --accent: #d9b27f;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 16px/1.65 "Noto Sans Georgian", system-ui, sans-serif;
    transition: background-color .25s linear, color .25s linear;
    overflow-x: hidden;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .demo-bar {
    position: relative; z-index: 5;
    background: #000; color: #f4e6cf; font-size: 12.5px; text-align: center; padding: 7px 16px;
  }
  .demo-bar a { color: #d9b27f; }

  /* Pinned tone meter: tells you which shade the page is "dyed" right now. */
  .tone-meter {
    position: fixed; right: 18px; bottom: 18px; z-index: 6;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 8px; border-radius: 999px;
    background: var(--fg); color: var(--bg);
    font-size: 13px; font-weight: 500;
    transition: background-color .25s linear, color .25s linear;
  }
  .tone-meter i { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 2px solid var(--bg); box-shadow: inset 0 0 0 2px var(--fg); }

  .wrap { width: min(1240px, 100% - 40px); margin-inline: auto; }

  header.top { display: flex; justify-content: space-between; align-items: center; padding: 22px 0; }
  .mini { font: 600 15px "Bodoni Moda", serif; letter-spacing: .38em; text-decoration: none; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang button { border: 0; background: transparent; color: var(--fg); padding: 6px 12px; border-radius: 999px; font: 500 13px inherit; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  /* Hero: a giant wordmark filled with a living gradient of tones, a tall portrait beside it. */
  .hero { display: grid; grid-template-columns: 1.35fr .65fr; gap: 36px; align-items: end; padding: 28px 0 40px; min-height: calc(100vh - 110px); }
  .word {
    font: 400 clamp(130px, 25vw, 380px)/.78 "Bodoni Moda", serif; margin: 0 0 0 -.04em; letter-spacing: -.03em;
    background: linear-gradient(100deg, #3d2418, #9a6136, #d9b27f, #f4e6cf, #c08a55, #6b3f26, #3d2418);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: dye 14s linear infinite;
  }
  @keyframes dye { to { background-position: 300% 0; } }
  .hero-copy { display: grid; grid-template-columns: auto 1fr; gap: 28px; margin-top: 34px; align-items: start; }
  .hero-copy .num { font: 400 italic 64px/1 "Bodoni Moda", serif; color: var(--accent); }
  .hero h1 { font: 300 clamp(24px, 2.6vw, 34px)/1.35 "Noto Serif Georgian", serif; margin: 0 0 14px; max-width: 26ch; }
  .hero p { margin: 0; color: var(--muted); max-width: 48ch; }
  .hero-side { display: grid; gap: 18px; }
  .rating { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
  .rating strong { color: var(--fg); font: 600 22px "Bodoni Moda", serif; }

  .cta {
    display: inline-flex; align-items: center; gap: 12px; margin-top: 26px;
    background: var(--fg); color: var(--bg); text-decoration: none; border: 0; cursor: pointer;
    padding: 15px 28px; border-radius: 999px; font: 600 15px "Noto Sans Georgian", sans-serif;
    transition: background-color .25s linear, color .25s linear, transform .2s ease;
  }
  .cta:hover { transform: translateY(-2px); }
  .cta svg { width: 18px; height: 18px; }

  /* Image placeholders: click or drop a photo to preview it. Combed open by strands. */
  .ph {
    position: relative; display: block; overflow: hidden; cursor: pointer;
    background: repeating-linear-gradient(135deg, transparent 0 14px, var(--line) 14px 15px);
    border: 1px dashed var(--line); border-radius: 2px;
    background-size: cover; background-position: center;
  }
  .ph.filled { border-style: solid; }
  .ph.filled .ph-text { opacity: 0; }
  .ph.over { outline: 2px solid var(--accent); outline-offset: -6px; }
  .ph-text { position: absolute; inset: auto 16px 16px 16px; display: grid; gap: 2px; font-size: 13px; transition: opacity .3s; }
  .ph-text b { font-weight: 600; font-size: 14px; }
  .ph-text span { color: var(--muted); }
  .strands { position: absolute; inset: 0; z-index: 2; display: flex; pointer-events: none; }
  .strands span {
    flex: 1; background: var(--bg); transform-origin: top;
    transition: transform 1s cubic-bezier(.7,0,.2,1), background-color .25s linear;
  }
  .combed .strands span { transform: scaleY(0); }

  section { padding: 120px 0 0; }
  .sec-head { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: baseline; margin-bottom: 48px; }
  .sec-head .idx { font: 400 italic 20px "Bodoni Moda", serif; color: var(--accent); }
  h2 { font: 300 clamp(34px, 5vw, 68px)/1.08 "Noto Serif Georgian", serif; margin: 0; letter-spacing: -.01em; }

  /* Gallery: asymmetric, magazine-like. */
  .gallery { display: grid; grid-template-columns: 1.2fr .8fr 1fr; gap: 22px; align-items: start; }
  .gallery .ph:nth-child(1) { aspect-ratio: 4/5; }
  .gallery .ph:nth-child(2) { aspect-ratio: 3/4; margin-top: 120px; }
  .gallery .ph:nth-child(3) { aspect-ratio: 1/1; margin-top: 40px; }

  /* Services as a price-book list; each row carries its own dye swatch. */
  .menu { border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 60px 1fr auto; gap: 24px; align-items: center;
    padding: 26px 0; border-bottom: 1px solid var(--line);
  }
  .swatch { width: 44px; height: 44px; border-radius: 50%; transition: transform .5s cubic-bezier(.2,.9,.2,1.3); }
  .row:hover .swatch { transform: scale(1.35) rotate(-12deg); }
  .row h3 { font: 500 clamp(22px, 2.6vw, 32px)/1.2 "Noto Serif Georgian", serif; margin: 0; }
  .row p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .row .dur { font: 400 italic 20px "Bodoni Moda", serif; color: var(--muted); white-space: nowrap; }

  /* Booking */
  .book { display: grid; grid-template-columns: .85fr 1.15fr; gap: 64px; }
  .book .lead { color: var(--muted); max-width: 36ch; margin: 18px 0 0; }
  .book .ph { aspect-ratio: 4/3; margin-top: 40px; }
  form { display: grid; gap: 26px; }
  .field-label { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    padding: 10px 16px; border-radius: 999px; font: 500 14px "Noto Sans Georgian", sans-serif; cursor: pointer;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .days { display: grid; grid-auto-flow: column; grid-auto-columns: 68px; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .day {
    border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 14px; padding: 10px 0; cursor: pointer;
    display: grid; justify-items: center; gap: 2px; font: 500 12px "Noto Sans Georgian", sans-serif;
  }
  .day b { font: 600 22px/1 "Bodoni Moda", serif; }
  .day[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  input[type=text], input[type=tel] {
    width: 100%; font: inherit; background: transparent; color: var(--fg);
    border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; border-radius: 0;
  }
  input::placeholder { color: var(--muted); }
  .notice { display: none; border: 1px solid var(--line); border-radius: 16px; padding: 18px; color: var(--fg); }
  .notice.show { display: block; animation: pop .5s cubic-bezier(.2,.9,.2,1.2); }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }

  .visit { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; border-top: 1px solid var(--line); padding-top: 28px; }
  .visit h3 { font: 400 italic 20px "Bodoni Moda", serif; color: var(--accent); margin: 0 0 8px; }
  .visit p { margin: 0; }

  footer { padding: 140px 0 48px; overflow: hidden; }
  footer .word { font-size: clamp(120px, 30vw, 460px); animation-duration: 20s; }
  footer p { color: var(--muted); font-size: 13px; margin: 8px 0 0; }

  @media (max-width: 900px) {
    .hero, .book, .visit, .sec-head { grid-template-columns: 1fr; }
    .hero { min-height: 0; }
    .gallery { grid-template-columns: 1fr 1fr; }
    .gallery .ph:nth-child(1) { grid-column: 1 / -1; }
    .gallery .ph:nth-child(2), .gallery .ph:nth-child(3) { margin-top: 0; }
    .fields { grid-template-columns: 1fr; }
    .row { grid-template-columns: 44px 1fr; }
    .row .dur { grid-column: 2; }
    .tone-meter span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .word { animation: none; }
    .strands { display: none; }
    body, .tone-meter { transition: none; }
  }
</style>
</head>
<body>
<div class="demo-bar" data-ka="კონცეპტი, რომელიც <a href='https://madebygio.dev'>madebygio.dev</a>-მ შექმნა. ეს არ არის LORO-ს ოფიციალური საიტი." data-en="A concept made by <a href='https://madebygio.dev'>madebygio.dev</a>. This is not LORO's official website."></div>

<div class="tone-meter" aria-hidden="true"><i></i><span id="tone-name">Tone 1 · Espresso</span></div>

<div class="wrap">
  <header class="top">

    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ka" aria-pressed="true">ქარ</button>

  <div class="hero">
    <div>
      <p class="word" aria-label="LORO">LORO</p>
      <div class="hero-copy">
        <span class="num" aria-hidden="true">✦</span>
        <div>
          <h1 data-ka="ფერი, ფორმა და თმა, რომელიც მხოლოდ თქვენ გიხდებათ." data-en="Colour, cut and hair that could only be yours."></h1>
          <p data-ka="სილამაზის სალონი ვაკეში. ჩამოსქროლეთ და გვერდი თავად შეიღებება, მუქი ესპრესოდან შამპანურისფერ ქერამდე." data-en="A beauty salon in Vake. Scroll down and the page dyes itself, from dark espresso to champagne blonde."></p>
          <a class="cta" href="#book"><span data-ka="ჩაეწერეთ ონლაინ" data-en="Book online"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>

      </label>
      <div class="rating"><span><strong>4.8</strong> Google</span><span data-ka="214 შეფასება" data-en="214 reviews"></span><span data-ka="ვაკე" data-en="Vake"></span></div>

  <section aria-labelledby="g-title">
    <div class="sec-head"><span class="idx" data-ka="ნამუშევრები" data-en="The work"></span><h2 id="g-title" data-ka="ყოველი ფერი ცალკე ირჩევა." data-en="Every shade is mixed for one person."></h2></div>
    <div class="gallery">
      <label class="ph comb"><input type="file" accept="image/*" hidden><div class="strands" aria-hidden="true"></div><span class="ph-text"><b data-ka="შეღებვის შედეგი" data-en="Colour result"></b><span data-ka="დააჭირეთ ან ჩააგდეთ სურათი" data-en="Click or drop an image"></span></span></label>
      <label class="ph comb"><input type="file" accept="image/*" hidden><div class="strands" aria-hidden="true"></div><span class="ph-text"><b data-ka="მელირება" data-en="Highlights"></b><span data-ka="დააჭირეთ ან ჩააგდეთ სურათი" data-en="Click or drop an image"></span></span></label>
      <label class="ph comb"><input type="file" accept="image/*" hidden><div class="strands" aria-hidden="true"></div><span class="ph-text"><b data-ka="სალონის ინტერიერი" data-en="Salon interior"></b><span data-ka="დააჭირეთ ან ჩააგდეთ სურათი" data-en="Click or drop an image"></span></span></label>
    </div>
  </section>

  <section aria-labelledby="s-title">
    <div class="sec-head"><span class="idx" data-ka="სერვისები" data-en="Services"></span><h2 id="s-title" data-ka="რას ვაკეთებთ" data-en="What we do"></h2></div>

      <div class="row"><span class="swatch" style="background:#3d2418"></span><div><h3 data-ka="შეჭრა" data-en="Haircut"></h3><p data-ka="კონსულტაცია, დაბანა და დავარცხნა." data-en="Consultation, wash and blow-dry."></p></div><span class="dur" data-ka="~1 სთ" data-en="~1 hr"></span></div>

      <div class="row"><span class="swatch" style="background:#d9b27f"></span><div><h3 data-ka="მელირება" data-en="Highlights"></h3><p data-ka="რბილი, ბუნებრივი გადასვლები." data-en="Soft, natural-looking blends."></p></div><span class="dur" data-ka="~2.5 სთ" data-en="~2.5 hrs"></span></div>
      <div class="row"><span class="swatch" style="background:#f4e6cf"></span><div><h3 data-ka="ვარცხნილობა" data-en="Styling"></h3><p data-ka="საღამოსთვის, ქორწილისთვის, ფოტოსესიისთვის." data-en="For evenings, weddings and shoots."></p></div><span class="dur" data-ka="~1 სთ" data-en="~1 hr"></span></div>
    </div>
  </section>

  <section id="book" aria-labelledby="b-title">
    <div class="book">
      <div>
        <div class="sec-head" style="grid-template-columns:1fr;margin:0"><span class="idx" data-ka="ჩაწერა" data-en="Booking"></span><h2 id="b-title" data-ka="აირჩიეთ თქვენი დრო." data-en="Pick your time."></h2></div>
        <p class="lead" data-ka="აირჩიეთ სერვისი, დღე და საათი. სალონი დაგიდასტურებთ." data-en="Choose a service, a day and an hour. The salon confirms it."></p>
        <label class="ph comb"><input type="file" accept="image/*" hidden><div class="strands" aria-hidden="true"></div><span class="ph-text"><b data-ka="ოსტატი სამუშაოდ" data-en="Stylist at work"></b><span data-ka="დააჭირეთ ან ჩააგდეთ სურათი" data-en="Click or drop an image"></span></span></label>
      </div>
      <form id="booking" novalidate>
        <div><span class="field-label" data-ka="სერვისი" data-en="Service"></span>
          <div class="chips" id="svc">
            <button type="button" class="chip" aria-pressed="true" data-ka="შეჭრა" data-en="Haircut"></button>
            <button type="button" class="chip" aria-pressed="false" data-ka="შეღებვა" data-en="Colour"></button>
            <button type="button" class="chip" aria-pressed="false" data-ka="მელირება" data-en="Highlights"></button>

          </div>

      <div><h3 data-ka="საათები" data-en="Hours"></h3><p data-ka="ყოველდღე 08:00 – 23:30" data-en="Daily 08:00 – 23:30"></p></div>

<footer>
  <div class="wrap">
    <p class="word" aria-hidden="true">LORO</p>
    <p data-ka="დემო-ვერსია · დიზაინი და დამზადება: madebygio.dev" data-en="Demo version · designed and built by madebygio.dev"></p>
  </div>
</footer>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- language ---------- */
  let lang = 'ka';
  const txt = {
    pick: { ka: 'აირჩიეთ დღე და საათი.', en: 'Choose a day and a time.' },
    done: {
      ka: (s, d, t) => `ეს დემოა, ამიტომ არაფერი გაიგზავნა. რეალურ საიტზე LORO მიიღებდა: ${s}, ${d}, ${t}.`,
      en: (s, d, t) => `This is a demo, so nothing was sent. On the real site LORO would get: ${s}, ${d}, ${t}.`
    },
    days: { ka: ['კვ','ორ','სმ','ოთ','ხთ','პრ','შბ'], en: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] }
  };
  function applyLang(next) {
    lang = next; document.documentElement.lang = next;
    document.querySelectorAll('[data-ka]').forEach(el => { el.innerHTML = el.dataset[next]; });
    document.querySelectorAll('[data-ph-ka]').forEach(el => { el.placeholder = el.dataset[next === 'ka' ? 'phKa' : 'phEn']; });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === next)));
    document.title = next === 'ka' ? 'LORO — სილამაზის სალონი (დემო)' : 'LORO — Beauty salon (demo)';
    renderDays();
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

  /* ---------- scroll dye: the page moves through eight hair tones ---------- */
  const tones = [
    ['#1c1210', 'Espresso'], ['#3d2418', 'Dark chocolate'], ['#6b3f26', 'Chestnut'], ['#9a6136', 'Copper'],
    ['#c08a55', 'Caramel'], ['#d9b27f', 'Honey'], ['#ead2a8', 'Sand blonde'], ['#f4e6cf', 'Champagne']
  ];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgb = c => `rgb(${c.join(',')})`;
  const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  const root = document.documentElement.style;
  const toneName = document.getElementById('tone-name');
  let ticking = false;
  function dye() {
    ticking = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
    const pos = p * (tones.length - 1);
    const i = Math.min(tones.length - 2, Math.floor(pos));
    const c = mix(hex(tones[i][0]), hex(tones[i + 1][0]), pos - i);
    const light = lum(c) > 0.55;
    root.setProperty('--bg', rgb(c));
    root.setProperty('--fg', light ? '#24141b' : '#f4e6cf');
    root.setProperty('--muted', light ? 'rgba(36,20,27,.66)' : 'rgba(244,230,207,.66)');
    root.setProperty('--line', light ? 'rgba(36,20,27,.22)' : 'rgba(244,230,207,.22)');
    root.setProperty('--accent', light ? '#6b3f26' : '#d9b27f');
    const k = Math.round(pos);
    toneName.textContent = `Tone ${k + 1} · ${tones[k][1]}`;
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(dye); } }, { passive: true });
  addEventListener('resize', dye);
  dye();

  /* ---------- the wordmark follows the pointer through the tones ---------- */
  if (!reduce) {
    const words = document.querySelectorAll('.word');
    addEventListener('pointermove', e => {
      const x = (e.clientX / innerWidth) * 100;
      words.forEach(w => { w.style.animationPlayState = 'paused'; w.style.backgroundPosition = `${x * 3}% 0`; });
    });
    addEventListener('pointerleave', () => words.forEach(w => { w.style.animationPlayState = 'running'; }));
  }

  /* ---------- image placeholders + comb reveal ---------- */
  document.querySelectorAll('.ph').forEach(ph => {
    const strands = ph.querySelector('.strands');
    if (strands) {
      for (let i = 0; i < 14; i++) {
        const s = document.createElement('span');
        s.style.transitionDelay = `${Math.abs(i - 6.5) * 45}ms`;
        strands.appendChild(s);
      }
    }
    const input = ph.querySelector('input');
    const show = f => {
      if (!f || !f.type.startsWith('image/')) return;
      ph.style.backgroundImage = `url(${URL.createObjectURL(f)})`;
      ph.classList.add('filled');
    };
    input.addEventListener('change', () => show(input.files[0]));
    ph.addEventListener('dragover', e => { e.preventDefault(); ph.classList.add('over'); });
    ph.addEventListener('dragleave', () => ph.classList.remove('over'));
    ph.addEventListener('drop', e => { e.preventDefault(); ph.classList.remove('over'); show(e.dataTransfer.files[0]); });
    if (ph.dataset.src) { ph.style.backgroundImage = `url(${ph.dataset.src})`; ph.classList.add('filled'); }
  });
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('combed'); io.unobserve(en.target); }
  }), { threshold: 0.35 });
  document.querySelectorAll('.comb').forEach(el => io.observe(el));

  /* ---------- booking ---------- */
  const pressOne = (group, btn) => { group.querySelectorAll('[aria-pressed]').forEach(b => b.setAttribute('aria-pressed', 'false')); btn.setAttribute('aria-pressed', 'true'); };
  const svc = document.getElementById('svc');
  svc.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => pressOne(svc, b)));

  const daysBox = document.getElementById('days');
  const timesBox = document.getElementById('times');
  let chosenDay = null, chosenTime = null;
  function renderTimes(seed) {
    timesBox.innerHTML = ''; chosenTime = null;
    for (let h = 10; h <= 21; h++) {
      if ((h + seed) % 4 === 0) continue;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = `${String(h).padStart(2, '0')}:00`; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => { pressOne(timesBox, b); chosenTime = b.textContent; });
      timesBox.appendChild(b);
    }
  }
  function renderDays() {
    daysBox.innerHTML = '';
    const now = new Date();
    for (let i = 0; i < 14; i++) {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'day'; b.setAttribute('aria-pressed', String(i === 0));
      b.innerHTML = `<span>${txt.days[lang][d.getDay()]}</span><b>${d.getDate()}</b>`;
      const label = `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, '0')}`;
      b.addEventListener('click', () => { pressOne(daysBox, b); chosenDay = label; renderTimes(d.getDate()); });
      daysBox.appendChild(b);
      if (i === 0) { chosenDay = label; renderTimes(d.getDate()); }
    }
  }

  document.getElementById('booking').addEventListener('submit', e => {
    e.preventDefault();
    const n = document.getElementById('notice');
    const s = svc.querySelector('[aria-pressed="true"]').textContent;
    n.textContent = chosenDay && chosenTime ? txt.done[lang](s, chosenDay, chosenTime) : txt.pick[lang];
    n.classList.remove('show'); void n.offsetWidth; n.classList.add('show');
  });

  applyLang('ka');
})();
</script>
</body>
</html>
