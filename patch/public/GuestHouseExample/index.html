<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guesthouse Old Street, Sololaki (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500;700&family=Noto+Sans+Georgian:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --balcony: #2f5d50;
    --balcony-deep: #1f4037;
    --brick: #a2492f;
    --plaster: #ecdcd0;
    --sky: #d3e6ea;
    --ink: #1f2a28;
    --white: #fffdfb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--white); color: var(--ink); font: 400 16px/1.65 Karla, "Noto Sans Georgian", system-ui, sans-serif; }
  :lang(ka) body, html:lang(ka) body { font-family: "Noto Sans Georgian", Karla, sans-serif; }
  a { color: inherit; }
  .demo-bar { background: var(--balcony-deep); color: #eaf2ef; font-size: 13px; text-align: center; padding: 8px 16px; }
  .demo-bar a { color: #f3c9b9; }
  .wrap { width: min(1100px, 100% - 32px); margin-inline: auto; }

  header.top { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
  .name { font: 600 20px Spectral, serif; color: var(--balcony-deep); text-decoration: none; }
  .lang { display: flex; gap: 4px; }
  .lang button { border: 1px solid var(--balcony); background: transparent; color: var(--balcony); padding: 6px 12px; border-radius: 999px; font: 500 13px Karla, sans-serif; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--balcony); color: var(--white); }

  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; padding: 24px 0 40px; }
  .hero h1 { font: 400 clamp(40px, 5.6vw, 70px)/1.05 Spectral, serif; margin: 0; color: var(--balcony-deep); }
  html:lang(ka) .hero h1 { font-family: "Noto Sans Georgian", sans-serif; font-weight: 600; font-size: clamp(32px, 4.4vw, 54px); line-height: 1.2; }
  .hero p { font-size: 18px; max-width: 42ch; margin: 20px 0 28px; }
  .balcony { width: 100%; height: auto; display: block; }
  .rating { margin-top: 20px; color: #4b5a56; font-size: 15px; }

  .btn { display: inline-block; background: var(--brick); color: #fff; text-decoration: none; border: 0; cursor: pointer; padding: 14px 26px; border-radius: 6px; font: 700 16px Karla, "Noto Sans Georgian", sans-serif; }
  .btn:hover { background: #853a25; }
  :focus-visible { outline: 3px solid var(--balcony); outline-offset: 3px; }

  section { padding: 80px 0 0; }
  h2 { font: 400 clamp(32px, 4.2vw, 48px)/1.15 Spectral, serif; color: var(--balcony-deep); margin: 0 0 24px; }
  html:lang(ka) h2 { font-family: "Noto Sans Georgian", sans-serif; font-weight: 600; font-size: clamp(26px, 3.4vw, 38px); }

  .why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .why h3 { font: 600 20px Spectral, serif; margin: 0 0 6px; color: var(--brick); }
  html:lang(ka) .why h3 { font-family: "Noto Sans Georgian", sans-serif; }
  .why p { margin: 0; }

  .book { background: var(--plaster); border-radius: 8px; padding: clamp(24px, 5vw, 52px); display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; }
  .book .lead { margin: 0; color: #4b5a56; }
  .save { margin-top: 20px; padding: 16px 18px; background: var(--white); border-left: 4px solid var(--brick); }
  form { display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 15px; }
  select, input { font: inherit; font-weight: 400; padding: 12px 14px; border-radius: 6px; border: 1px solid #c9b6a8; background: var(--white); color: var(--ink); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .notice { display: none; background: var(--white); border-radius: 6px; padding: 16px; border-left: 4px solid var(--balcony); }
  .notice.show { display: block; }

  .where { display: grid; grid-template-columns: 1.2fr .8fr; gap: 40px; }
  .where ul { margin: 0; padding-left: 20px; }
  .where li { margin-bottom: 6px; }

  footer { padding: 72px 0 40px; color: #4b5a56; font-size: 14px; }

  @media (max-width: 820px) {
    .hero, .why, .book, .where, .two { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="demo-bar" data-en="This is a concept made by <a href='https://madebygio.dev'>madebygio.dev</a>. It is not Guesthouse Old Street's official website." data-ka="ეს არის კონცეპტი, რომელიც <a href='https://madebygio.dev'>madebygio.dev</a>-მ შექმნა. ეს არ არის სასტუმრო სახლის ოფიციალური საიტი."></div>

<div class="wrap">
  <header class="top">
    <a class="name" href="#">Guesthouse Old Street</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ka" aria-pressed="false">ქარ</button>
    </div>
  </header>

  <div class="hero">
    <div>
      <h1 data-en="A quiet room on an old Sololaki street." data-ka="მყუდრო ოთახი ძველი სოლოლაკის ქუჩაზე."></h1>
      <p data-en="Clean rooms with air conditioning, kind hosts and Old Tbilisi right outside the door. Book directly with us." data-ka="სუფთა ოთახები კონდიციონერით, თბილი მასპინძლები და ძველი თბილისი კარის გარეთ. დაჯავშნეთ პირდაპირ ჩვენთან."></p>
      <a class="btn" href="#book" data-en="Check availability" data-ka="თავისუფალი დღეები"></a>
      <div class="rating">★ 4.8 <span data-en="on Google" data-ka="Google-ზე"></span></div>
    </div>

    <!-- Carved wooden balcony, in the style of Old Tbilisi houses -->
    <svg class="balcony" viewBox="0 0 520 420" role="img" aria-label="Illustration of a carved wooden balcony in Old Tbilisi">
      <rect x="0" y="0" width="520" height="420" fill="#d3e6ea"/>
      <rect x="0" y="250" width="520" height="170" fill="#ecdcd0"/>
      <g fill="#c9775a" opacity=".55">
        <rect x="0" y="270" width="60" height="18"/><rect x="70" y="270" width="60" height="18"/><rect x="390" y="270" width="60" height="18"/><rect x="460" y="270" width="60" height="18"/>
        <rect x="35" y="296" width="60" height="18"/><rect x="425" y="296" width="60" height="18"/>
        <rect x="0" y="322" width="60" height="18"/><rect x="460" y="322" width="60" height="18"/>
      </g>
      <rect x="60" y="40" width="400" height="16" fill="#1f4037"/>
      <path d="M60 56 h400 v20 h-400z" fill="#2f5d50"/>
      <g fill="none" stroke="#2f5d50" stroke-width="10">
        <rect x="80" y="76" width="360" height="150"/>
        <line x1="200" y1="76" x2="200" y2="226"/>
        <line x1="320" y1="76" x2="320" y2="226"/>
      </g>
      <g fill="#fffdfb" opacity=".55">
        <rect x="90" y="86" width="105" height="130"/><rect x="205" y="86" width="110" height="130"/><rect x="325" y="86" width="105" height="130"/>
      </g>
      <g fill="none" stroke="#a2492f" stroke-width="4">
        <path d="M95 140 q47 -50 95 0"/><path d="M210 140 q50 -50 100 0"/><path d="M330 140 q47 -50 95 0"/>
      </g>
      <rect x="60" y="226" width="400" height="14" fill="#1f4037"/>
      <g fill="#2f5d50">
        <rect x="60" y="240" width="400" height="10"/>
        <rect x="60" y="300" width="400" height="10"/>
      </g>
      <g fill="none" stroke="#2f5d50" stroke-width="5">
        <path d="M70 250 l25 25 l-25 25 M120 250 l25 25 l-25 25 M170 250 l25 25 l-25 25 M220 250 l25 25 l-25 25 M270 250 l25 25 l-25 25 M320 250 l25 25 l-25 25 M370 250 l25 25 l-25 25 M420 250 l25 25 l-25 25"/>
        <path d="M95 250 l-25 25 l25 25 M145 250 l-25 25 l25 25 M195 250 l-25 25 l25 25 M245 250 l-25 25 l25 25 M295 250 l-25 25 l25 25 M345 250 l-25 25 l25 25 M395 250 l-25 25 l25 25 M445 250 l-25 25 l25 25"/>
      </g>
      <g fill="#1f4037">
        <path d="M80 310 l-20 50 h14 l20 -50z"/><path d="M440 310 l20 50 h-14 l-20 -50z"/>
        <path d="M250 310 h20 v40 h-20z"/>
      </g>
      <g fill="#a2492f"><circle cx="150" cy="235" r="6"/><circle cx="260" cy="235" r="6"/><circle cx="370" cy="235" r="6"/></g>
    </svg>
  </div>

  <section aria-labelledby="why-title">
    <h2 id="why-title" data-en="Why guests stay here" data-ka="რატომ ირჩევენ ჩვენთან დარჩენას"></h2>
    <div class="why">
      <div><h3 data-en="In the middle of it all" data-ka="ყველაფრის შუაგულში"></h3><p data-en="Sololaki, a short walk from Freedom Square and the old town." data-ka="სოლოლაკი, თავისუფლების მოედნიდან და ძველი უბნიდან რამდენიმე წუთის სავალზე."></p></div>
      <div><h3 data-en="Clean and cool" data-ka="სუფთა და გრილი"></h3><p data-en="Tidy rooms with air conditioning for hot Tbilisi summers." data-ka="მოწესრიგებული ოთახები კონდიციონერით თბილისის ცხელი ზაფხულისთვის."></p></div>
      <div><h3 data-en="Hosts who care" data-ka="მზრუნველი მასპინძლები"></h3><p data-en="A family-run guesthouse with real local character." data-ka="ოჯახური სასტუმრო სახლი ნამდვილი ადგილობრივი იერით."></p></div>
    </div>
  </section>

  <section id="book" aria-labelledby="book-title">
    <div class="book">
      <div>
        <h2 id="book-title" data-en="Book your stay" data-ka="დაჯავშნეთ"></h2>
        <p class="lead" data-en="Pick your dates and send a request. We reply to confirm." data-ka="აირჩიეთ თარიღები და გამოგზავნეთ მოთხოვნა. ჩვენ დაგიდასტურებთ."></p>
        <div class="save" data-en="<strong>Booking direct</strong> means no booking-site fees, and you talk to the hosts from the start." data-ka="<strong>პირდაპირი ჯავშნით</strong> არ იხდით ჯავშნის საიტების საკომისიოს და თავიდანვე მასპინძლებს ესაუბრებით."></div>
      </div>
      <form id="booking" novalidate>
        <div class="two">
          <label><span data-en="Check-in" data-ka="შესვლა"></span><input type="date" id="in"></label>
          <label><span data-en="Check-out" data-ka="გასვლა"></span><input type="date" id="out"></label>
        </div>
        <label><span data-en="Guests" data-ka="სტუმრები"></span>
          <select id="guests"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
        </label>
        <div class="two">
          <label><span data-en="Name" data-ka="სახელი"></span><input type="text" autocomplete="off"></label>
          <label><span data-en="Email" data-ka="ელფოსტა"></span><input type="email" autocomplete="off"></label>
        </div>
        <button class="btn" type="submit" data-en="Request to book" data-ka="ჯავშნის მოთხოვნა"></button>
        <div class="notice" id="notice" role="status"></div>
      </form>
    </div>
  </section>

  <section aria-labelledby="where-title">
    <h2 id="where-title" data-en="Where we are" data-ka="სად ვართ"></h2>
    <div class="where">
      <div>
        <p><strong data-en="7 Shalva Dadiani St, Sololaki" data-ka="შალვა დადიანის ქ. 7, სოლოლაკი"></strong><br>Tbilisi 0105</p>
        <ul>
          <li data-en="Walk to Freedom Square" data-ka="ფეხით თავისუფლების მოედნამდე"></li>
          <li data-en="City and sightseeing buses pass the street" data-ka="ქალაქის და ტურისტული ავტობუსები ქუჩაზე გადის"></li>
          <li data-en="Old town, bars and cafés nearby" data-ka="ახლოს ძველი უბანი, ბარები და კაფეები"></li>
        </ul>
      </div>
      <div>
        <p><strong data-en="Contact" data-ka="კონტაქტი"></strong><br><a href="tel:+995571027195">+995 571 02 71 95</a></p>
      </div>
    </div>
  </section>
</div>

<footer>
  <div class="wrap" data-en="Demo version, designed and built by <a href='https://madebygio.dev'>madebygio.dev</a>." data-ka="დემო-ვერსია. დიზაინი და დამზადება: <a href='https://madebygio.dev'>madebygio.dev</a>"></div>
</footer>

<script>
  let lang = 'en';
  function applyLang(next) {
    lang = next;
    document.documentElement.lang = next;
    document.querySelectorAll('[data-en]').forEach(el => { el.innerHTML = el.dataset[next]; });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === next)));
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

  const inD = document.getElementById('in'), outD = document.getElementById('out');
  const d0 = new Date(), d1 = new Date(Date.now() + 2 * 86400000);
  inD.min = outD.min = d0.toISOString().slice(0, 10);
  inD.value = d0.toISOString().slice(0, 10);
  outD.value = d1.toISOString().slice(0, 10);
  inD.addEventListener('change', () => { outD.min = inD.value; if (outD.value <= inD.value) outD.value = ''; });

  document.getElementById('booking').addEventListener('submit', e => {
    e.preventDefault();
    const n = document.getElementById('notice');
    const g = document.getElementById('guests').value;
    const ok = inD.value && outD.value && outD.value > inD.value;
    const msg = {
      en: ok ? `This is a demo, so nothing was sent. On the real site, the hosts would get your request: ${inD.value} to ${outD.value}, ${g} guest(s).` : 'Choose a check-in and a later check-out date.',
      ka: ok ? `ეს დემოა, ამიტომ არაფერი გაიგზავნა. რეალურ საიტზე მასპინძლები მიიღებდნენ მოთხოვნას: ${inD.value} – ${outD.value}, ${g} სტუმარი.` : 'აირჩიეთ შესვლის და უფრო გვიანი გასვლის თარიღი.'
    };
    n.textContent = msg[lang];
    n.classList.add('show');
  });

  applyLang('en');
</script>
</body>
</html>
