<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="QUIRE — write markdown, watch it set as a document, export a real PDF with selectable text. Runs entirely in your browser."
    />
    <title>QUIRE — markdown to PDF</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23faf9f6'/%3E%3Cpath d='M8 8h16M8 14h16M8 20h11' stroke='%231a1a17' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M8 26h6' stroke='%235d7049' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem('quire:theme')
          var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
